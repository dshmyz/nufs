{{define "chunks"}}<!DOCTYPE html>
<html>{{template "head" .}}
<body>
<div class="layout">
{{template "sidebar" .}}
<div class="main">
{{template "topbar" .}}
<div class="content">
<div class="card">
  <div class="card-header"><h3>Search Chunk</h3></div>
  <div class="card-body">
    <div class="form-inline">
      <input type="text" id="chunkID" class="input" placeholder="Chunk ID" onkeydown="if(event.key==='Enter')lookupChunk()">
      <button class="btn btn-primary" onclick="lookupChunk()">Lookup</button>
      <span class="form-sep">or</span>
      <input type="text" id="inodeID" class="input" placeholder="Inode ID" onkeydown="if(event.key==='Enter')listChunks()">
      <button class="btn" onclick="listChunks()">List Chunks for Inode</button>
    </div>
  </div>
</div>
<div id="chunkResult"></div>
</div>
</div>
</div>
{{template "scripts_base" .}}
<script>
function lookupChunk(){
  const id=document.getElementById('chunkID').value.trim();
  if(!id)return;
  const el=document.getElementById('chunkResult');
  el.innerHTML='<p class="loading">Loading...</p>';
  fetch('/api/v1/chunks/'+id).then(r=>{if(!r.ok)throw new Error('Chunk not found');return r.json()})
  .then(d=>{
    let html='<div class="card"><div class="card-header"><h3>Chunk '+d.id+'</h3></div><div class="card-body"><table class="table detail-table">';
    html+='<tr><td>ID</td><td>'+d.id+'</td></tr>';
    html+='<tr><td>Size</td><td>'+d.size+' bytes</td></tr>';
    html+='<tr><td>State</td><td><span class="badge badge-'+chunkStateClass(d.state)+'">'+chunkStateLabel(d.state)+'</span></td></tr>';
    html+='<tr><td>Checksum</td><td>'+(d.checksum||0)+'</td></tr>';
    html+='<tr><td>Created</td><td>'+formatUnix(d.create_time)+'</td></tr></table></div></div>';
    if(d.replicas&&d.replicas.length){
      html+='<div class="card"><div class="card-header"><h3>Replicas ('+d.replicas.length+')</h3></div><div class="card-body p-0"><table class="table"><thead><tr><th>Node ID</th><th>Address</th><th>State</th><th>Disk</th></tr></thead><tbody>';
      d.replicas.forEach(function(r){
        html+='<tr><td><a href="/admin/nodes/'+r.node_id+'">'+r.node_id+'</a></td><td>'+(r.addr||'-')+'</td>';
        html+='<td><span class="badge badge-'+replicaStateClass(r.state)+'">'+replicaStateLabel(r.state)+'</span></td><td>'+(r.disk_path||'-')+'</td></tr>';
      });
      html+='</tbody></table></div></div>';
    }
    el.innerHTML=html;
  }).catch(e=>{el.innerHTML='<div class="card"><div class="card-body"><p class="empty">'+e.message+'</p></div></div>'});
}
function listChunks(){
  const id=document.getElementById('inodeID').value.trim();
  if(!id)return;
  const el=document.getElementById('chunkResult');
  el.innerHTML='<p class="loading">Loading...</p>';
  fetch('/api/v1/chunks?inode_id='+id).then(r=>{if(!r.ok)throw new Error('Failed');return r.json()})
  .then(data=>{
    if(!data||!data.length){el.innerHTML='<div class="card"><div class="card-body"><p class="empty">No chunks found</p></div></div>';return}
    let html='<div class="card"><div class="card-header"><h3>Chunks ('+data.length+')</h3></div><div class="card-body p-0">';
    html+='<table class="table"><thead><tr><th>Chunk ID</th><th>Offset</th><th>Length</th><th>Version</th></tr></thead><tbody>';
    data.forEach(function(c){html+='<tr><td><a href="#" onclick="lookupSpecific('+c.id+');return false">'+c.id+'</a></td><td>'+c.offset+'</td><td>'+c.length+'</td><td>'+(c.version||0)+'</td></tr>'});
    html+='</tbody></table></div></div>';
    el.innerHTML=html;
  }).catch(e=>{el.innerHTML='<div class="card"><div class="card-body"><p class="empty">'+e.message+'</p></div></div>'});
}
function lookupSpecific(id){document.getElementById('chunkID').value=id;lookupChunk()}
function chunkStateLabel(s){const m={0:'Sealing',1:'Sealed',2:'Ready',3:'Degraded',4:'Orphan'};return m[s]||'Unknown'}
function chunkStateClass(s){const m={0:'info',1:'primary',2:'success',3:'warning',4:'secondary'};return m[s]||'secondary'}
function replicaStateLabel(s){const m={0:'Syncing',1:'Ready',2:'Stale',3:'Failed'};return m[s]||'Unknown'}
function replicaStateClass(s){const m={0:'info',1:'success',2:'warning',3:'danger'};return m[s]||'secondary'}
function formatUnix(ts){if(!ts||ts===0)return '-';var d=new Date(Math.floor(ts/1000000));return isNaN(d.getTime())?'-':d.toLocaleString()}
</script>
</body>
</html>{{end}}
