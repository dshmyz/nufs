# NUFS Prometheus Alerting Rules
# These rules intentionally reference metrics emitted by the current metad and
# datanode exporters. Run `promtool check rules alerting-rules.yaml` after edits.

groups:
  - name: nufs.critical
    rules:
      - alert: NUFSClusterQuorumAtRisk
        expr: nufs_nodes_total > 0 and nufs_nodes_online / nufs_nodes_total < 0.66
        for: 2m
        labels:
          severity: critical
          team: storage
          component: metad
        annotations:
          summary: "Cluster quorum is at risk: less than 2/3 nodes are online"
          runbook: "https://docs.nufs.io/runbook/quorum-at-risk"

      - alert: NUFSDiskUsageCritical
        expr: nufs_disk_capacity_bytes > 0 and nufs_disk_used_bytes / nufs_disk_capacity_bytes > 0.95
        for: 5m
        labels:
          severity: critical
          team: storage
          component: datanode
        annotations:
          summary: "Disk usage exceeds 95% — writes may fail soon"
          runbook: "https://docs.nufs.io/runbook/disk-usage-critical"

      - alert: NUFSDiskFailed
        expr: nufs_disk_state{state="failed"} > 0
        for: 1m
        labels:
          severity: critical
          team: storage
          component: datanode
        annotations:
          summary: "A datanode disk is marked failed"
          runbook: "https://docs.nufs.io/runbook/disk-failed"

      - alert: NUFSNodeWriteErrorRateCritical
        expr: nufs_node_write_error_rate > 0.5
        for: 3m
        labels:
          severity: critical
          team: storage
          component: datanode
        annotations:
          summary: "Datanode {{ $labels.node_id }} write error rate exceeds 50% — writes are being down-weighted"
          runbook: "https://docs.nufs.io/runbook/node-write-errors"

      - alert: NUFSClusterReadinessDegraded
        expr: nufs_cluster_readiness < 2
        for: 2m
        labels:
          severity: critical
          team: storage
          component: metad
        annotations:
          summary: "Cluster readiness is degraded or not ready"
          runbook: "https://docs.nufs.io/runbook/cluster-readiness"

      - alert: NUFSClusterLeaderUnstable
        expr: nufs_cluster_leader_stable == 0
        for: 2m
        labels:
          severity: critical
          team: storage
          component: metad
        annotations:
          summary: "Raft leader is not stable — writes may be failing"
          runbook: "https://docs.nufs.io/runbook/leader-instability"

      - alert: NUFSClusterUnderReplicated
        expr: nufs_cluster_chunks_under_replicated > 0
        for: 15m
        labels:
          severity: warning
          team: storage
          component: metad
        annotations:
          summary: "{{ $value }} chunks are under-replicated"
          runbook: "https://docs.nufs.io/runbook/under-replicated"

      - alert: NUFSObjectWriteFailuresPersisting
        expr: sum(nufs_object_write_attempts{state="failed"}) > 0
        for: 5m
        labels:
          severity: critical
          team: storage
          component: s3gateway
        annotations:
          summary: "Object writes are failing and require operator attention"
          runbook: "docs/runbooks/object-write-recovery.md"

      - alert: NUFSObjectWriteWorkerDeadLetter
        expr: nufs_object_write_background_task_state{state="dead_letter"} > 0
        for: 1m
        labels:
          severity: critical
          team: storage
          component: metad
        annotations:
          summary: "Object write recovery or GC worker is in dead-letter state"
          runbook: "docs/runbooks/object-write-recovery.md"

      - alert: NUFSBucketQuotaBytesCritical
        expr: nufs_bucket_quota_used_ratio{resource="bytes"} > 0.95
        for: 5m
        labels:
          severity: critical
          team: storage
          component: metad
        annotations:
          summary: "Bucket {{ $labels.bucket }} byte quota usage exceeds 95%"
          runbook: "docs/runbooks/bucket-quota.md"

      - alert: NUFSBucketQuotaObjectsCritical
        expr: nufs_bucket_quota_used_ratio{resource="objects"} > 0.95
        for: 5m
        labels:
          severity: critical
          team: storage
          component: metad
        annotations:
          summary: "Bucket {{ $labels.bucket }} object quota usage exceeds 95%"
          runbook: "docs/runbooks/bucket-quota.md"

  - name: nufs.warning
    rules:
      - alert: NUFSDiskUsageHigh
        expr: nufs_disk_capacity_bytes > 0 and nufs_disk_used_bytes / nufs_disk_capacity_bytes > 0.85
        for: 30m
        labels:
          severity: warning
          team: storage
          component: datanode
        annotations:
          summary: "Disk usage exceeds 85% — rebalance capacity limited"
          runbook: "https://docs.nufs.io/runbook/disk-usage-high"

      - alert: NUFSNodeOffline
        expr: nufs_nodes_total > 0 and nufs_nodes_online < nufs_nodes_total * 0.8
        for: 5m
        labels:
          severity: warning
          team: storage
          component: metad
        annotations:
          summary: "More than 20% of registered nodes are offline"
          runbook: "https://docs.nufs.io/runbook/node-offline"

      - alert: NUFSErrorRateHigh
        expr: rate(nufs_errors_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
          team: storage
          component: metad
        annotations:
          summary: "Metadata service is reporting errors"
          runbook: "https://docs.nufs.io/runbook/metad-errors"

      - alert: NUFSMetadReadLatencyHigh
        expr: nufs_read_latency_us{quantile="0.99"} > 10000
        for: 10m
        labels:
          severity: warning
          team: storage
          component: metad
        annotations:
          summary: "Metadata read p99 latency exceeds 10ms SLO"
          runbook: "https://docs.nufs.io/runbook/metad-read-latency"

      - alert: NUFSMetadWriteLatencyHigh
        expr: nufs_write_latency_us{quantile="0.99"} > 50000
        for: 10m
        labels:
          severity: warning
          team: storage
          component: metad
        annotations:
          summary: "Metadata write p99 latency exceeds 50ms SLO"
          runbook: "https://docs.nufs.io/runbook/metad-write-latency"

      - alert: NUFSDatanodeReplicationErrors
        expr: rate(nufs_datanode_replication_errors_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          team: storage
          component: datanode
        annotations:
          summary: "Datanode replication errors observed"
          runbook: "https://docs.nufs.io/runbook/replication-errors"

      - alert: NUFSNodeWriteErrorRateHigh
        expr: nufs_node_write_error_rate > 0.2
        for: 5m
        labels:
          severity: warning
          team: storage
          component: datanode
        annotations:
          summary: "Datanode {{ $labels.node_id }} write error rate exceeds 20%"
          runbook: "https://docs.nufs.io/runbook/node-write-errors"

      - alert: NUFSAntiEntropyMismatches
        expr: rate(nufs_datanode_antientropy_mismatches_total[30m]) > 0
        for: 30m
        labels:
          severity: warning
          team: storage
          component: datanode
        annotations:
          summary: "Anti-entropy found chunk mismatches"
          runbook: "https://docs.nufs.io/runbook/antientropy-mismatches"

      - alert: NUFSObjectWriteRecoveryBacklog
        expr: sum(nufs_object_write_attempts{state="recovery_needed"}) > 0
        for: 10m
        labels:
          severity: warning
          team: storage
          component: s3gateway
        annotations:
          summary: "Object write recovery backlog is not draining"
          runbook: "docs/runbooks/object-write-recovery.md"

      - alert: NUFSObjectWriteHalfWritesPersisting
        expr: sum(nufs_object_write_attempts{state=~"pending|chunks_allocated"}) > 0
        for: 15m
        labels:
          severity: warning
          team: storage
          component: s3gateway
        annotations:
          summary: "Object writes are stuck before durable commit"
          runbook: "docs/runbooks/object-write-recovery.md"

      - alert: NUFSObjectWriteWorkerStale
        expr: nufs_object_write_background_task_last_updated_seconds > 0 and time() - nufs_object_write_background_task_last_updated_seconds > 900
        for: 5m
        labels:
          severity: warning
          team: storage
          component: metad
        annotations:
          summary: "Object write recovery or GC worker has not updated recently"
          runbook: "docs/runbooks/object-write-recovery.md"

      - alert: NUFSBucketQuotaBytesHigh
        expr: nufs_bucket_quota_used_ratio{resource="bytes"} > 0.80
        for: 15m
        labels:
          severity: warning
          team: storage
          component: metad
        annotations:
          summary: "Bucket {{ $labels.bucket }} byte quota usage exceeds 80%"
          runbook: "docs/runbooks/bucket-quota.md"

      - alert: NUFSBucketQuotaObjectsHigh
        expr: nufs_bucket_quota_used_ratio{resource="objects"} > 0.80
        for: 15m
        labels:
          severity: warning
          team: storage
          component: metad
        annotations:
          summary: "Bucket {{ $labels.bucket }} object quota usage exceeds 80%"
          runbook: "docs/runbooks/bucket-quota.md"

      - alert: NUFSBackupStale
        expr: time() - nufs_backup_last_success_timestamp_seconds > 4500
        for: 5m
        labels:
          severity: warning
          team: storage
          component: metad
        annotations:
          summary: "Metadata backup has not completed recently"
          runbook: "docs/runbooks/metadata-disaster-recovery.md"

      - alert: NUFSBackupVerificationFailed
        expr: increase(nufs_backup_verification_failures_total[15m]) > 0
        for: 1m
        labels:
          severity: warning
          team: storage
          component: metad
        annotations:
          summary: "Metadata backup verification failed"
          runbook: "docs/runbooks/metadata-disaster-recovery.md"

      - alert: NUFSChunkTombstoneBacklog
        expr: nufs_chunk_tombstone_oldest_age_seconds > 93600
        for: 30m
        labels:
          severity: warning
          team: storage
          component: metad
        annotations:
          summary: "Chunk tombstones are waiting beyond the purge safety window"
          runbook: "docs/runbooks/metadata-disaster-recovery.md"

  - name: nufs.info
    rules:
      - alert: NUFSDiskDegraded
        expr: nufs_disk_state{state="degraded"} > 0
        for: 5m
        labels:
          severity: info
          team: storage
          component: datanode
        annotations:
          summary: "A disk is in degraded state — monitoring for recovery"
          runbook: "https://docs.nufs.io/runbook/disk-degraded"
