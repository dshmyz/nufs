---
# NUFS 多节点集群一键部署
#
# 用法: ansible-playbook -i inventory.ini site.yml
#
# 只部署某个模块（各自会先跑 common 的构建+分发）:
#   ansible-playbook -i inventory.ini metad.yml
#   ansible-playbook -i inventory.ini datanode.yml
#   ansible-playbook -i inventory.ini s3.yml
#
# 可覆盖参数（-e k=v）:
#   need_sudo=false     免 sudo（本机/测试）
#   build_binaries=false  binaries_dir=<已有二进制目录>   已有安装包时跳过编译
#   data_root=... bin_dir=... deploy_dir=... run_dir=...
#
# 说明：deploy.sh 按节点本机 IP 识别角色，inventory 的 ansible_host 必须填真实 IP。

- name: Validate inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: metad_nodes 需为奇数台（raft quorum）
      assert:
        that:
          - groups['metad_nodes'] | length >= 1
          - groups['metad_nodes'] | length % 2 == 1
        fail_msg: "metad_nodes 必须是非空奇数台（raft quorum），当前 {{ groups['metad_nodes'] | length }} 台"
    - name: datanode_nodes 非空
      assert:
        that: groups['datanode_nodes'] | length >= 1
        fail_msg: "datanode_nodes 不能为空"
    - name: s3_gateway 恰好 1 台
      assert:
        that: groups['s3_gateway'] | length == 1
        fail_msg: "s3_gateway 必须恰好 1 台，当前 {{ groups['s3_gateway'] | length }} 台"

- name: metad 模块
  import_playbook: metad.yml

- name: datanode 模块
  import_playbook: datanode.yml

- name: s3 模块
  import_playbook: s3.yml

- name: Final verify on owner node
  hosts: metad_nodes
  become: "{{ need_sudo }}"
  tasks:
    - name: run full verify (raft quorum + datanode registration)
      command: "{{ deploy_dir }}/deploy.sh verify"
      environment: "{{ deploy_env }}"
      register: vf
      until: vf.rc == 0
      retries: 10
      delay: 5
      when: meta_ordinal | int == 1
      changed_when: false
