# NUFS 3 节点部署清单（每台节点 = metad-N + datanode-N，S3 网关挂在节点 A）
#
# 使用（从本目录）:
#   ansible-playbook -i inventory.ini site.yml     # 部署
#   ansible-playbook -i inventory.ini down.yml     # 停止
#
# 前置条件:
#   - 控制机装有 Ansible，且能 SSH 免密到每台 VM（ansible_user 可加在主机行）
#   - 每台 VM 的 ansible_host 填真实 IP（deploy.sh 靠 IP 自动识别角色）
#   - 运行用户有 sudo（密码用 -K 传入，或配置免密 sudo）
#
# 常见覆盖: -e build_binaries=false -e binaries_dir=/path/to/已构建二进制
#          -e data_root=/srv/nufs -e need_sudo=false 等，见 site.yml 头部注释

[metad_nodes]
nufs-a ansible_host=10.0.0.11 meta_ordinal=1
nufs-b ansible_host=10.0.0.12 meta_ordinal=2
nufs-c ansible_host=10.0.0.13 meta_ordinal=3

[datanode_nodes]
nufs-a ansible_host=10.0.0.11 dn_ordinal=1
nufs-b ansible_host=10.0.0.12 dn_ordinal=2
nufs-c ansible_host=10.0.0.13 dn_ordinal=3

[s3_gateway]
nufs-a ansible_host=10.0.0.11

# 管理台（可选）：部署 nufs-admin Web 控制台（ansible-playbook -i inventory.ini admin.yml）
# 通常挂 metad-1 所在节点，或单独一台
[admin]
nufs-a ansible_host=10.0.0.11

# 端口/路径/need_sudo 等默认值见 group_vars/all.yml，可用 -e 覆盖
