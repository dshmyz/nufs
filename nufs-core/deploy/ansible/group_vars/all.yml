# 集群默认配置（可被 -e 或 inventory 覆盖）
# 端口按节点编号自动 +0/+1/+2
data_root: /var/lib/nufs
bin_dir: /usr/local/bin
deploy_dir: /opt/nufs
run_dir: /var/run/nufs
metad_ops_port: 18091
metad_raft_port: 17001
datanode_chunk_port: 9103
datanode_ops_port: 18096
s3_port: 8081
# 是否以 root 执行（sudo）。false 时用于本机/免 sudo 测试
need_sudo: true

# ============================================================
# 配置文件 = 这里 + inventory.ini。改这里，命令行就只剩：
#   ansible-playbook -i inventory.ini site.yml     # 全量部署
#   ansible-playbook -i inventory.ini metad.yml    # 只部署 metad
#   ansible-playbook -i inventory.ini down.yml     # 停止
# 不需要其他 -e（-e 仅在临时覆盖时用）。
# ============================================================

# 部署后要 seed 的 S3 凭据列表（生产模式下网关没凭据会 403）。直接写这里：
seed_credentials: []
# seed_credentials:
#   - { access_key: TESTAK000000000000, secret_key: test-secret-value }

# ---- 控制器侧 ----
# 默认不构建：直接复用 make package / make build-linux 的产物（nufs-core/bin/linux-amd64）。
# 想用别处二进制：-e binaries_dir=<目录>；想由 ansible 现场构建：-e build_binaries=true
build_binaries: false
binaries_dir: "{{ playbook_dir + '/../../bin/linux-amd64' }}"
deploy_script_src: "{{ playbook_dir + '/../vm/deploy.sh' }}"

# ---- 派生：deploy.sh 执行环境（中文输出需 UTF-8 locale）----
deploy_env:
  NUFS_BIN: "{{ bin_dir }}"
  NUFS_RUN_DIR: "{{ run_dir }}"
  LC_ALL: "C.UTF-8"
  LANG: "C.UTF-8"

# ---- 派生：按 ordinal 排序的节点列表（inventory 顺序无关）----
metad_hosts: "{{ groups['metad_nodes'] | map('extract', hostvars) | list | sort(attribute='meta_ordinal') }}"
datanode_hosts: "{{ groups['datanode_nodes'] | map('extract', hostvars) | list | sort(attribute='dn_ordinal') }}"
gateway_host: "{{ groups['s3_gateway'] | map('extract', hostvars) | list | first }}"

# ---- 密钥：首次生成并持久化到 secrets/，之后复用 ----
auth_token: "{{ lookup('ansible.builtin.password', playbook_dir + '/secrets/auth_token chars=hexdigits length=32') }}"
token_signing_key: "{{ lookup('ansible.builtin.password', playbook_dir + '/secrets/token_signing_key chars=hexdigits length=32') }}"
credential_secret_key: "{{ lookup('ansible.builtin.password', playbook_dir + '/secrets/credential_secret_key chars=hexdigits length=64') }}"
