# NUFS Single-Machine Development Cluster
#
# Starts: 1x metad + 2x datanode + 1x nufs-s3
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#   curl http://localhost:8081/healthz
#
# Credentials (optional): set NUFUS_ACCESS_KEY / NUFUS_SECRET_KEY env vars
# or create deploy/credentials/s3.yaml before starting.

services:
  metad:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nufs:latest
    entrypoint: /usr/local/bin/metad
    command:
      - --data-dir=/var/lib/dfs/metadata
      - --ops-addr=0.0.0.0:8091
      - --raft=false
      - --allow-insecure-dev
      - --log-level=info
      - --log-json=true
    ports:
      - "8091:8091"
    volumes:
      - nufs-data:/var/lib/dfs

  # V1 datanodes (legacy ChunkStore). Excluded by default via the
  # "v1" profile — run `docker compose --profile v1 up` to include
  # them. The default stack is V2.1-only (metad + datanode-v21 + s3).
  datanode-1:
    image: nufs:latest
    entrypoint: /usr/local/bin/datanode
    profiles: ["v1"]
    command:
      - --node-id=auto
      - --listen=0.0.0.0:9100
      - --register-addr=datanode-1:9100
      - --data-dir=/var/lib/dfs/datanode1
      - --metadata=metad:8091
      - --rack=rack1
      - --zone=zone1
      - --capacity=500
      - --log-level=info
      - --log-json=true
    depends_on:
      - metad
    volumes:
      - nufs-data:/var/lib/dfs
    restart: unless-stopped

  datanode-2:
    image: nufs:latest
    entrypoint: /usr/local/bin/datanode
    profiles: ["v1"]
    command:
      - --node-id=auto
      - --listen=0.0.0.0:9101
      - --register-addr=datanode-2:9101
      - --data-dir=/var/lib/dfs/datanode2
      - --metadata=metad:8091
      - --rack=rack1
      - --zone=zone1
      - --capacity=500
      - --log-level=info
      - --log-json=true
    depends_on:
      - metad
    volumes:
      - nufs-data:/var/lib/dfs
    restart: unless-stopped

  # V2.1 storage engine data node — uses the same binary with
  # --storage-version=v2.1. Verifies the V2.1 engine through the
  # full read/write path via the S3 gateway.
  datanode-v21:
    image: nufs:latest
    entrypoint: /usr/local/bin/datanode
    command:
      - --node-id=auto
      - --listen=0.0.0.0:9102
      - --register-addr=datanode-v21:9102
      - --data-dir=/var/lib/dfs/datanode-v21
      - --metadata=metad:8091
      - --rack=rack1
      - --zone=zone1
      - --capacity=500
      - --storage-version=v2.1
      - --log-level=info
      - --log-json=true
    depends_on:
      - metad
    volumes:
      - nufs-data:/var/lib/dfs
    restart: unless-stopped

  # V2.1 data node in JBOD multi-disk mode (--data-dirs=/d0,/d1). Proves
  # the multi-disk parity gate: the V2 adapter aggregates every disk with
  # least-used placement, so data lands on BOTH disks, not just the first.
  # Excluded by default via the "multidisk" profile so the standard
  # single-disk V2.1 integration run is unaffected.
  datanode-v21-multi:
    image: nufs:latest
    entrypoint: /usr/local/bin/datanode
    profiles: ["multidisk"]
    command:
      - --node-id=auto
      - --listen=0.0.0.0:9103
      - --register-addr=datanode-v21-multi:9103
      - --data-dirs=/var/lib/dfs/d0,/var/lib/dfs/d1
      - --metadata=metad:8091
      - --rack=rack1
      - --zone=zone1
      - --capacity=500
      - --storage-version=v2.1
      - --log-level=info
      - --log-json=true
    depends_on:
      - metad
    volumes:
      - nufs-data:/var/lib/dfs
    restart: unless-stopped

  s3:
    image: nufs:latest
    entrypoint: /usr/local/bin/nufs-s3
    command:
      - --listen=0.0.0.0:8080
      - --meta-addr=metad:8091
      - --part-dir=/var/lib/dfs/parts
      - --access-key=AKIAIOSFODNN7EXAMPLE
      - --secret-key=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      - --rate-limit=1000
      - --rate-limit-burst=2000
      - --credentials-file=/etc/nufs/credentials.yaml
      - --log-level=info
      - --log-json=true
    ports:
      - "8081:8080"
    depends_on:
      - metad
    volumes:
      - nufs-data:/var/lib/dfs
      - ${NUFS_CREDENTIALS_FILE:-./credentials/s3.yaml}:/etc/nufs/credentials.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting-rules.yaml:/etc/prometheus/alerting-rules.yaml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    depends_on:
      - metad
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./monitoring/grafana-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/nufs-overview.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  nufs-data:
