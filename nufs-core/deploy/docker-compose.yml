# NUFS Single-Machine Development Cluster
#
# Starts: 1x metad + 2x datanode + 1x nufs-s3
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#   curl http://localhost:8081/healthz
#
# Credentials (optional): set NUFUS_ACCESS_KEY / NUFUS_SECRET_KEY env vars
# or create deploy/credentials/s3.yaml before starting.

services:
  metad:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nufs:latest
    entrypoint: /usr/local/bin/metad
    command:
      - --data-dir=/var/lib/nufs/metadata
      - --ops-addr=0.0.0.0:8091
      - --raft=false
      - --allow-insecure-dev
      # Auth: seed the S3 gateway's credential into the metad registry so both
      # fuse (token exchange) and the S3 gateway (SigV4 sync) authenticate
      # against the single registry. --credential-secret-key lets metad seal
      # the plaintext secret for the gateway's credential sync. In production
      # use `nufs-cli auth add` instead of --dev-seed-cred.
      - --token-signing-key=dev-token-key
      - --auth-token=dev-ops-token
      - --credential-secret-key=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      - --dev-seed-cred=AKIAIOSFODNN7EXAMPLE:wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      - --log-level=info
      - --log-format=json
    ports:
      - "8091:8091"
    volumes:
      - nufs-data:/var/lib/nufs

  # V1 datanodes (legacy ChunkStore). Excluded by default via the
  # "v1" profile — run `docker compose --profile v1 up` to include
  # them. The default stack is V2.1-only (metad + datanode-v21 + s3).
  datanode-1:
    image: nufs:latest
    entrypoint: /usr/local/bin/datanode
    profiles: ["v1"]
    command:
      - --node-id=auto
      - --listen=0.0.0.0:9100
      - --register-addr=datanode-1:9100
      - --data-dir=/var/lib/nufs/datanode1
      - --metadata=metad:8091
      - --rack=rack1
      - --zone=zone1
      - --capacity=500
      - --log-level=info
      - --log-format=json
    depends_on:
      - metad
    volumes:
      - nufs-data:/var/lib/nufs
    restart: unless-stopped

  datanode-2:
    image: nufs:latest
    entrypoint: /usr/local/bin/datanode
    profiles: ["v1"]
    command:
      - --node-id=auto
      - --listen=0.0.0.0:9101
      - --register-addr=datanode-2:9101
      - --data-dir=/var/lib/nufs/datanode2
      - --metadata=metad:8091
      - --rack=rack1
      - --zone=zone1
      - --capacity=500
      - --log-level=info
      - --log-format=json
    depends_on:
      - metad
    volumes:
      - nufs-data:/var/lib/nufs
    restart: unless-stopped

  # V2.1 storage engine data node — V2.1 IS the only engine (V1 storage
  # engine retired in roadmap stage 2), no --storage-version flag. Verifies
  # the V2.1 engine through the full read/write path via the S3 gateway.
  datanode-v21:
    image: nufs:latest
    entrypoint: /usr/local/bin/datanode
    command:
      - --node-id=auto
      - --listen=0.0.0.0:9102
      - --register-addr=datanode-v21:9102
      - --data-dir=/var/lib/nufs/datanode-v21
      - --metadata=metad:8091
      - --rack=rack1
      - --zone=zone1
      - --capacity=500
      - --log-level=info
      - --log-format=json
    depends_on:
      - metad
    volumes:
      - nufs-data:/var/lib/nufs
    restart: unless-stopped

  # V2.1 data node in JBOD multi-disk mode (--data-dirs=/d0,/d1). Proves
  # the multi-disk parity gate: the V2 adapter aggregates every disk with
  # least-used placement, so data lands on BOTH disks, not just the first.
  # Excluded by default via the "multidisk" profile so the standard
  # single-disk V2.1 integration run is unaffected.
  datanode-v21-multi:
    image: nufs:latest
    entrypoint: /usr/local/bin/datanode
    profiles: ["multidisk"]
    command:
      - --node-id=auto
      - --listen=0.0.0.0:9103
      - --register-addr=datanode-v21-multi:9103
      - --data-dirs=/var/lib/nufs/d0,/var/lib/nufs/d1
      - --metadata=metad:8091
      - --rack=rack1
      - --zone=zone1
      - --capacity=500
      - --log-level=info
      - --log-format=json
    depends_on:
      - metad
    volumes:
      - nufs-data:/var/lib/nufs
    restart: unless-stopped

  s3:
    image: nufs:latest
    entrypoint: /usr/local/bin/nufs-s3
    command:
      - --listen=0.0.0.0:8080
      - --meta-addr=metad:8091
      - --part-dir=/var/lib/nufs/parts
      # Credentials come from the metad registry (seeded via --dev-seed-cred
      # above): --meta-auth-token enables the registry credential sync. The
      # legacy --access-key/--secret-key/--credentials-file sources are
      # deprecated and removed here.
      - --meta-auth-token=dev-ops-token
      - --credential-sync-interval=30s
      - --rate-limit=1000
      - --rate-limit-burst=2000
      - --log-level=info
      - --log-format=json
    ports:
      - "8081:8080"
    depends_on:
      - metad
    volumes:
      - nufs-data:/var/lib/nufs
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting-rules.yaml:/etc/prometheus/alerting-rules.yaml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    depends_on:
      - metad
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./monitoring/grafana-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/nufs-overview.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  nufs-data:
