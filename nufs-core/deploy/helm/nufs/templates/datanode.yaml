apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-datanode
  labels:
    {{- include "nufs.datanode.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-datanode
  replicas: {{ .Values.datanode.replicaCount }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.upgradeStrategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "nufs.datanode.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nufs.datanode.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.datanode.service.opsPort }}"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: datanode
          image: "{{ .Values.global.imageRegistry }}{{ .Values.datanode.image.repository }}:{{ .Values.datanode.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.datanode.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: data
              containerPort: {{ .Values.datanode.service.dataPort }}
            - name: ops
              containerPort: {{ .Values.datanode.service.opsPort }}
          # Derive rack/zone from the pod ordinal so each datanode declares its
          # fault domain (used by EC allocation). topologySpreadConstraints keeps
          # the ordinals balanced across real zones/racks, so the hint tracks the
          # physical placement as long as faultDomains matches topology domains.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ORD="{{ .Values.datanode.config.rackPrefix }}"
              case "$POD_NAME" in *-*) ORD="${POD_NAME##*-}";; esac
              RACK=$(( (10#$ORD % {{ .Values.datanode.config.faultDomains }}) + 1 ))
              ZONE=$(( (10#$ORD % {{ .Values.datanode.config.faultDomains }}) + 1 ))
              exec /usr/local/bin/datanode \
                --node-id=auto \
                --listen=0.0.0.0:{{ .Values.datanode.service.dataPort }} \
                --ops-addr=0.0.0.0:{{ .Values.datanode.service.opsPort }} \
                --data-dir=/data \
                --metadata={{ .Release.Name }}-metad:{{ .Values.metad.service.port }} \
                --capacity={{ .Values.datanode.config.capacityGB }} \
                --rack="{{ .Values.datanode.config.rackPrefix }}${RACK}" \
                --zone="{{ .Values.datanode.config.zonePrefix }}${ZONE}" {{- if .Values.observability.tracing.enabled }} \
                --trace-enabled=true \
                --trace-endpoint={{ .Values.observability.tracing.endpoint }} \
                --trace-insecure={{ .Values.observability.tracing.insecure }} {{- end }} \
                {{- if .Values.global.security.secretName }} \
                --metadata-auth-token="$(cat /etc/nufs-secret/auth-token)" \
                --ops-auth-token="$(cat /etc/nufs-secret/auth-token)" \
                {{- end }} \
                --log-json=true \
                "$@"
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.global.security.secretName }}
            - name: nufs-secret
              mountPath: /etc/nufs-secret
              readOnly: true
            {{- end }}
            {{- if .Values.datanode.config.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.datanode.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: ops
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: ops
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        {{- if .Values.global.security.secretName }}
        - name: nufs-secret
          secret:
            secretName: {{ .Values.global.security.secretName }}
        {{- end }}
        {{- if .Values.datanode.config.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.datanode.config.tls.certSecret }}
        {{- end }}
      {{- with .Values.datanode.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.datanode.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.datanode.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.datanode.topologyKey }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.datanode.topologyMaxSkew }}
          topologyKey: {{ .Values.datanode.topologyKey }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "nufs.datanode.labels" . | nindent 14 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- else if .Values.datanode.persistence.storageClass }}
        storageClassName: {{ .Values.datanode.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.datanode.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-datanode
  labels:
    {{- include "nufs.datanode.labels" . | nindent 4 }}
spec:
  type: {{ .Values.datanode.service.type }}
  ports:
    - name: data
      port: {{ .Values.datanode.service.dataPort }}
      targetPort: data
    - name: ops
      port: {{ .Values.datanode.service.opsPort }}
      targetPort: ops
  selector:
    {{- include "nufs.datanode.labels" . | nindent 4 }}
