# NUFS Helm Chart Values

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# metad service configuration
metad:
  replicaCount: 3
  image:
    repository: nufs/metad
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  service:
    type: ClusterIP
    port: 8091
    raftPort: 7000
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  config:
    shardCount: 4
    raftEnabled: true
    tls:
      enabled: false
      certSecret: ""
  # Remote metadata backups (S3/MinIO). The code path requires Raft + a stable
  # cluster identity. Off by default — enable in prod so backups are long-lived
  # and content lives outside the metad failure domain.
  backup:
    enabled: false
    clusterId: ""               # stable across restarts; REQUIRED when enabled
    localTmpDir: "/var/lib/dfs/backup-tmp"  # scratch only; object store is durable target
    interval: "1h"
    retention: 24               # committed backups to retain
    s3:
      bucket: ""                # required when enabled (e.g. minio://... or AWS s3://...)
      prefix: ""                # e.g. "prod/metadata"
      region: ""
      endpoint: ""              # S3-compatible (MinIO): set here; path-style is used
    # Provide AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY via this k8s secret, or
    # use IRSA/workload identity and leave credentialsSecret empty.
    credentialsSecret: ""
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - metad
            topologyKey: kubernetes.io/hostname
  # PDB keeps raft quorum (>= 2/3) during voluntary maintenance.
  pdb:
    enabled: true
    maxUnavailable: 1

# datanode configuration
datanode:
  # EC 6+3 = 9 shards. For full rack/zone-failure tolerance place >= 9 datanode
  # pods across >= 3 fault domains (3 shards each). replicaCount: 3 is the
  # minimal multi-node default (one shard-set per node) — raise to 9 for 5-9.
  replicaCount: 3
  image:
    repository: nufs/datanode
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  service:
    type: ClusterIP
    dataPort: 9100
    opsPort: 8091
  persistence:
    enabled: true
    size: 100Gi
    storageClass: ""
  config:
    capacityGB: 100
    # Rack/zone are set per-replica from the pod ordinal (fault-domain hint used
    # by EC allocation). faultDomains must be >= 3 for EC 6+3 rack tolerance and
    # must match the number of topology domains the spread below targets.
    faultDomains: 3
    rackPrefix: "rack"
    zonePrefix: "zone"
    writeConcurrency: 64
    repairWorkers: 4
    tls:
      enabled: false
      certSecret: ""
    diskManager:
      warnPct: 0.75
      criticalPct: 0.85
      rejectPct: 0.90
  nodeSelector: {}
  tolerations: []
  # Fault-domain hardening for EC shards (5-9): one datanode pod per physical
  # node (required anti-affinity) and balanced spread across zones/racks
  # (topologySpreadConstraints). Set topologyKey to "nufs.io/rack" for on-prem
  # where racks are not zones.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - datanode
          topologyKey: kubernetes.io/hostname
  topologyKey: "topology.kubernetes.io/zone"
  topologyMaxSkew: 1
  # Optional node label used to target rack topology (on-prem); empty = rely on zones.
  rackNodeLabel: ""
  pdb:
    enabled: true
    maxUnavailable: 1

# S3 gateway configuration
s3gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: nufs/nufs-s3
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  config:
    rbac:
      enabled: false
      credentialsSecret: ""
    tls:
      enabled: false
      certSecret: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Observability
observability:
  tracing:
    enabled: false
    endpoint: "otel-collector:4317"
    insecure: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false
      interval: 15s
  pprof:
    enabled: false

# Rolling upgrade strategy
upgradeStrategy:
  maxUnavailable: 1
  autoRebalance: true
  autoRebalanceInterval: 5m
  autoRebalanceThreshold: 0.15
  autoRebalanceMaxMigrations: 10
