# NUFS FUSE Gateway Configuration
# Usage:
#   nufs-fuse --backend=dfs [flags] <mountpoint>
#   nufs-fuse --backend=s3 [flags] <s3-endpoint/bucket/prefix> <mountpoint>

# === Shared ===
backend: "dfs"                         # dfs (distributed filesystem) or s3 (external S3 bucket)
cache_dir: ""                          # Chunk cache directory (empty=memory only)

# === DFS backend (--backend=dfs) ===
mountpoint: "/mnt/dfs"
meta_dir: "/var/lib/dfs/metadata"      # Local mode: Pebble data directory
meta_addr: ""                          # Remote mode: metadata HTTP address

# === S3 backend (--backend=s3) ===
# target: "https://s3.amazonaws.com/my-bucket"
# mountpoint: "/mnt/s3"
# scan_ttl: "60s"
# read_only: false
# cache_quota: 0
# metrics_addr: ":9900"
# insecure: false
# debug: false
# uid: 0
# gid: 0
