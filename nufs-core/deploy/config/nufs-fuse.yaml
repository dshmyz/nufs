# NUFS FUSE Gateway Configuration
# ───────────────────────────────
# Usage:
#   nufs-fuse --config nufs-fuse.yaml <mountpoint>
#
# All keys are flag names (kebab-case or snake_case both work).
# CLI flags unconditionally override YAML values.
# Secrets should be set via env vars or this file, NOT via CLI flags
# (CLI values are visible in ps(1)).

# ── General ────────────────────────────────────────────────────────
config_version: 1                     # config schema version; a mismatch with the
                                      # binary logs a WARN at startup so a renamed
                                      # key is not silently dropped on upgrade
backend: "dfs"                        # "dfs" (distributed filesystem) or "s3" (external S3 bucket)

# ── Logging ────────────────────────────────────────────────────────
log_level:  "info"                    # debug | info | warn | error
log_format: "text"                    # text|json
log_file:   ""                        # log file path (default: nufs-{mountpoint}.log; empty = that default)
log_max_size:     100                 # max log file size in MB before rotation
log_max_backups:  7                   # max rotated log files to keep

# ── DFS backend ────────────────────────────────────────────────────
# (required when backend=dfs)

bucket:     ""                        # bucket to mount (REQUIRED for DFS)

# Metadata source: remote (mutually exclusive with meta_dir).
# When TLS flags are set the scheme is auto-detected as https://;
# plain http:// is used otherwise.
meta_addr:      ""                    # metad address, e.g. "10.0.0.1:8091"
meta_dir:       "/var/lib/dfs/metadata"  # local Pebble directory (for single-node dev)

# ── DFS authentication ─────────────────────────────────────────────
# Credential precedence: --access-key > --config file > META_* env vars.
access_key:     ""                    # metad access key (or set via META_ACCESS_KEY env)
secret_key:     ""                    # metad secret key (or set via META_SECRET_KEY env)

# ── DFS cache & memory limits ──────────────────────────────────────
# read_cache_max: Chunk read-cache memory limit (ChunkCache). Evicts
#                 via LRU when the limit is reached. 0 = disabled.
# write_cache_max: Dirty write buffer memory limit (per-file buffers).
#                  Exceeding this throttles writes with ENOSPC. 0 = disabled.
cache_dir:          ""                # chunk cache directory (empty = memory only)
read_cache_max:     1073741824        # bytes (default 1 GiB; 0 = disabled)
write_cache_max:    2147483648        # bytes (default 2 GiB; 0 = disabled)
direct_io:          false             # DFS: bypass kernel page cache

# ── DFS TLS ────────────────────────────────────────────────────────
# When any of tls_cert or insecure is set, the metadata and datanode
# channels use HTTPS with the configured transport; otherwise plain
# HTTP.  --insecure is shared with the S3 backend (see below).
#
# For a TLS-enabled cluster:
#   tls_cert:           "/etc/nufs/client.pem"
#   tls_key:            "/etc/nufs/client-key.pem"
#   tls_ca:             "/etc/nufs/ca.pem"
#   tls_require_client_cert: true
#
# For dev / self-signed certs (skip verification only):
#   insecure:           true
#
# insecure:           false             # skip TLS server certificate verification (dev only)
# tls_cert:           ""                # TLS certificate file (PEM)
# tls_key:            ""                # TLS private key file (PEM)
# tls_ca:             ""                # CA certificate for mutual TLS (client verification)
# tls_require_client_cert: false        # require client cert signed by tls_ca

# ── Metrics & monitoring (shared) ──────────────────────────────────
metrics_addr:   ":9901"               # Metrics/health HTTP address (DFS and S3; empty = disabled)

# ── FUSE mount options (shared) ───────────────────────────────────
uid:            0                     # file owner UID (0 = caller's uid)
gid:            0                     # file owner GID (0 = caller's gid)
allow_other:    false                 # allow other users to access the mount
read_only:      false                 # read-only mount (deny all writes with EROFS)
debug:          false                 # verbose FUSE + metadata traces

# ── S3 backend ────────────────────────────────────────────────────
# (used when backend=s3; all DFS fields above are ignored)
scan_ttl:       "60s"                 # directory scan cache TTL
insecure:       false                 # skip TLS verification for S3 endpoint
