# Data Node Configuration
# Usage: datanode --config=datanode.yaml
# CLI flags override YAML values.

listen: "0.0.0.0:9100"
node_id: "auto"                          # "auto" = hash machine-id, or a number
data_dir: "/var/lib/dfs/datanode"
data_dir: ""                              # 逗号分隔即 JBOD 多盘
base_port: 9101
metadata: "localhost:8091"               # Metadata service address
ops_addr: "0.0.0.0:8091"                  # Operations HTTP API address
machine_id: ""
external_host: ""
rack: "rack1"
zone: "zone1"
capacity_gb: 1000

log_level: "info"
log_format: "text"
log_file: ""                            # 空=stderr；填路径则落盘并轮转
log_max_size: 100
log_max_backups: 7

# OpenTelemetry tracing
trace_enabled: false
trace_endpoint: ""
trace_insecure: true
