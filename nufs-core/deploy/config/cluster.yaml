# Cluster-wide Settings
# Referenced by services that need global policy; per-service configs
# in metad.yaml, datanode.yaml, s3gw.yaml, fusegw.yaml.

cluster:
  name: "dfs-cluster-01"
  region: "us-east-1"

# Placement policy defaults
placement:
  replication_factor: 3
  topology_spread: "rack"             # node, rack, zone
  storage_tier: "hot"

# Repair & maintenance (runs inside metadata service)
repair:
  scan_interval: "30s"
  max_concurrent_repairs: 5

rebalance:
  threshold: 0.1                      # 10% imbalance triggers rebalance
  max_migrations_per_run: 100
  scan_interval: "5m"
