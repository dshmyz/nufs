# Metadata Service Configuration
# Usage: metad --config=metad.yaml
# CLI flags override YAML values.

data_dir: "/var/lib/dfs/metadata"
cache_dir: ""
ops_addr: "0.0.0.0:8091"
node_id: 1
log_level: "info"
log_json: false

# Raft consensus (optional, for multi-node HA)
raft:
  enabled: true
  listen: "0.0.0.0:7000"
  data_dir: "/var/lib/dfs/raft"
  bootstrap: false

# TLS (requires both cert and key)
tls_cert: ""
tls_key: ""

# Auth token for ops API (empty = no auth)
auth_token: ""

# Background tasks
lease_ttl: "30s"
gc_interval: "10m"
gc_dry_run: false
scrub_interval: "1h"

# Backups (empty backup_dir disables scheduled checkpoints)
backup_dir: ""
backup_interval: "1h"
backup_max: 24
backup_dry_run: false

# OpenTelemetry tracing
trace_enabled: false
trace_endpoint: ""
trace_insecure: true
