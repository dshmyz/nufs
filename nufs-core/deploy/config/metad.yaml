# Metadata Service Configuration
# Usage: metad --config=metad.yaml
# CLI flags override YAML values.

config_version: 1                 # config schema version; a mismatch with the binary
                                  # logs a WARN at startup so a renamed key is not
                                  # silently dropped on upgrade

data_dir: "/var/lib/dfs/metadata"
cache_dir: ""
ops_addr: "0.0.0.0:8091"
node_id: 1
log_level: "info"
log_json: false
log_file: ""                      # log file path (empty = stderr)
log_max_size: 100                 # max log file size in MB before rotation
log_max_backups: 7                # max rotated log files to keep

# Raft consensus (optional, for multi-node HA)
raft:
  enabled: true
  listen: "0.0.0.0:7000"
  data_dir: "/var/lib/dfs/raft"
  bootstrap: false

# TLS (requires both cert and key)
tls_cert: ""
tls_key: ""

# Auth token for ops API (empty = no auth)
auth_token: ""

# HMAC key that signs mount auth tokens. Must be set for nufs-fuse mounts to
# authenticate; keep it here or in the platform secret rather than on the CLI
# (CLI values are visible in ps(1)).
token_signing_key: ""

# Key rotation: set this to the OLD key while token_signing_key holds the new
# one. New tokens are always minted with token_signing_key; the previous key is
# verify-only, so tokens already handed out stay valid until they expire.
# Remove it once the longest token TTL (6h) has elapsed.
token_signing_key_previous: ""

# Background tasks
lease_ttl: "30s"
gc_interval: "10m"
gc_dry_run: false
scrub_interval: "1h"

# Remote metadata backups (S3/MinIO).
# These are command-line flags (see docs/runbooks/metadata-disaster-recovery.md);
# this block documents the values to pass. Off by default — enable in production
# so backups are long-lived AND content is stored outside the metad fault domain.
# Requires --raft and a stable --cluster-id. Credentials come from the runtime
# environment (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) or the platform secret.
#--backup-enabled=true
#--cluster-id=<stable-cluster-id>
#--backup-local-dir=/var/lib/dfs/backup-tmp
#--backup-interval=1h
#--backup-retention=24
#--backup-s3-bucket=<bucket>
#--backup-s3-prefix=<env>/metadata
#--backup-s3-region=<region>
#--backup-s3-endpoint=<s3-compatible-endpoint>  # MinIO / non-AWS; omit for AWS

# OpenTelemetry tracing
trace_enabled: false
trace_endpoint: ""
trace_insecure: true
