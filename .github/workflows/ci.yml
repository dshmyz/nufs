name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: Core tests and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nufs-core
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: nufs-core/go.sum

      - name: Run core tests
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee "$RUNNER_TEMP/nufs-core-test.log"

      - name: Run core vet
        shell: bash
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee "$RUNNER_TEMP/nufs-core-vet.log"

      - name: Sanitize core diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sanitized_dir="$RUNNER_TEMP/nufs-sanitized-core"
          rm -rf "$sanitized_dir"
          mkdir -p "$sanitized_dir"
          shopt -s nullglob
          for log in "$RUNNER_TEMP"/nufs-core-*.log; do
            sed -E \
              -e 's/(secret|token|password|passwd|api[_-]?key|access[_-]?key|secret[_-]?key)[[:space:]]*[:=][[:space:]]*[^[:space:],;"'"']+/\\1=[REDACTED]/Ig' \
              -e 's/(Authorization:[[:space:]]*(Bearer|Basic|AWS4-HMAC-SHA256))[[:space:]]+[^[:space:]]+/\\1 [REDACTED]/Ig' \
              -e 's/(ghp_|gho_|ghs_|github_pat_)[A-Za-z0-9_:-]+/[REDACTED]/g' \
              -e 's/AKIAIOSFODNN[0-9]EXAMPLE/[REDACTED]/g' \
              -e 's/wJalrXUtnFEMI\/K7MDENG\/bPxRfiCYEXAMPLEKEY[0-9]*/[REDACTED]/g' \
              "$log" > "$sanitized_dir/$(basename "$log")"
          done

      - name: Upload sanitized core diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-diagnostics
          if-no-files-found: warn
          path: ${{ runner.temp }}/nufs-sanitized-core

  admin:
    name: Admin tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nufs-admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: true
          cache-dependency-path: nufs-admin/go.sum

      - name: Run admin tests
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee "$RUNNER_TEMP/nufs-admin-test.log"

      - name: Sanitize admin diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sanitized_dir="$RUNNER_TEMP/nufs-sanitized-admin"
          rm -rf "$sanitized_dir"
          mkdir -p "$sanitized_dir"
          sed -E \
            -e 's/(secret|token|password|passwd|api[_-]?key|access[_-]?key|secret[_-]?key)[[:space:]]*[:=][[:space:]]*[^[:space:],;"'"']+/\\1=[REDACTED]/Ig' \
            -e 's/(Authorization:[[:space:]]*(Bearer|Basic|AWS4-HMAC-SHA256))[[:space:]]+[^[:space:]]+/\\1 [REDACTED]/Ig' \
            -e 's/(ghp_|gho_|ghs_|github_pat_)[A-Za-z0-9_:-]+/[REDACTED]/g' \
            -e 's/AKIAIOSFODNN[0-9]EXAMPLE/[REDACTED]/g' \
            -e 's/wJalrXUtnFEMI\/K7MDENG\/bPxRfiCYEXAMPLEKEY[0-9]*/[REDACTED]/g' \
            "$RUNNER_TEMP/nufs-admin-test.log" > "$sanitized_dir/nufs-admin-test.log"

      - name: Upload sanitized admin diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-diagnostics
          if-no-files-found: warn
          path: ${{ runner.temp }}/nufs-sanitized-admin

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nufs-admin/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: nufs-admin/web/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/nufs-frontend-npm-ci.log"

      - name: Build frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/nufs-frontend-build.log"

      - name: Sanitize frontend diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sanitized_dir="$RUNNER_TEMP/nufs-sanitized-frontend"
          rm -rf "$sanitized_dir"
          mkdir -p "$sanitized_dir"
          shopt -s nullglob
          for log in "$RUNNER_TEMP"/nufs-frontend-*.log; do
            sed -E \
              -e 's/(secret|token|password|passwd|api[_-]?key|access[_-]?key|secret[_-]?key)[[:space:]]*[:=][[:space:]]*[^[:space:],;"'"']+/\\1=[REDACTED]/Ig' \
              -e 's/(Authorization:[[:space:]]*(Bearer|Basic|AWS4-HMAC-SHA256))[[:space:]]+[^[:space:]]+/\\1 [REDACTED]/Ig' \
              -e 's/(ghp_|gho_|ghs_|github_pat_)[A-Za-z0-9_:-]+/[REDACTED]/g' \
              -e 's/AKIAIOSFODNN[0-9]EXAMPLE/[REDACTED]/g' \
              -e 's/wJalrXUtnFEMI\/K7MDENG\/bPxRfiCYEXAMPLEKEY[0-9]*/[REDACTED]/g' \
              "$log" > "$sanitized_dir/$(basename "$log")"
          done

      - name: Upload sanitized frontend diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          if-no-files-found: warn
          path: ${{ runner.temp }}/nufs-sanitized-frontend

  production-fast:
    name: Production fast gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nufs-core
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: nufs-core/go.sum

      - name: Run production fast gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify.sh --level fast 2>&1 | tee "$RUNNER_TEMP/nufs-verify.log"

      - name: Sanitize production gate diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sanitized_dir="$RUNNER_TEMP/nufs-sanitized-production-fast"
          rm -rf "$sanitized_dir"
          mkdir -p "$sanitized_dir"
          sanitize_file() {
            local source="$1"
            local destination="$2"
            mkdir -p "$(dirname "$destination")"
            sed -E \
              -e 's/(secret|token|password|passwd|api[_-]?key|access[_-]?key|secret[_-]?key)[[:space:]]*[:=][[:space:]]*[^[:space:],;"'"']+/\\1=[REDACTED]/Ig' \
              -e 's/(Authorization:[[:space:]]*(Bearer|Basic|AWS4-HMAC-SHA256))[[:space:]]+[^[:space:]]+/\\1 [REDACTED]/Ig' \
              -e 's/(ghp_|gho_|ghs_|github_pat_)[A-Za-z0-9_:-]+/[REDACTED]/g' \
              -e 's/AKIAIOSFODNN[0-9]EXAMPLE/[REDACTED]/g' \
              -e 's/wJalrXUtnFEMI\/K7MDENG\/bPxRfiCYEXAMPLEKEY[0-9]*/[REDACTED]/g' \
              "$source" > "$destination"
          }
          sanitize_file "$RUNNER_TEMP/nufs-verify.log" "$sanitized_dir/nufs-verify.log"
          for source_dir in /tmp/nufs-verify-testlogs .drill-results; do
            [[ -d "$source_dir" ]] || continue
            while IFS= read -r -d '' source; do
              relative_path="${source#"$source_dir"/}"
              sanitize_file "$source" "$sanitized_dir/$(basename "$source_dir")/$relative_path"
            done < <(find "$source_dir" -type f -print0)
          done

      - name: Upload sanitized production gate diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-fast-diagnostics
          if-no-files-found: warn
          path: ${{ runner.temp }}/nufs-sanitized-production-fast
